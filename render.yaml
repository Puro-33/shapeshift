# Render Blueprint: single free web service. Database lives on Neon Free (no expiry).
# Render Free Postgres is intentionally NOT used (expires 30 days after creation).
services:
  - type: web
    name: shapeshift
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        sync: false # Neon connection string (pooled), set in dashboard
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
